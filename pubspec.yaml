name: rental_monorepo
description: "Flutter monorepo for rental fleet management applications with shared UI components and design system."
publish_to: "none"

environment:
  sdk: ">=3.5.0 <4.0.0"

workspace:
  - apps/operation_fleet
  - packages/design_system
  - packages/tokens
  - packages/ui
  - packages/core
  - packages/utils

dev_dependencies:
  melos: ^7.1.1
  very_good_analysis: ^9.0.0
