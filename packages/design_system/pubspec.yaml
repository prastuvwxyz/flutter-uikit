name: design_system
description: Design system package with tokens, themes, components, and patterns for the rental fleet portal
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Core design dependencies
  material_color_utilities: ^0.11.1
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  
  # Charts
  fl_chart: ^0.69.2

  # Animation and motion
  animations: ^2.0.11
  
  # Utilities
  intl: ^0.19.0
  file_picker: ^5.2.5
  
  # Icons
  cupertino_icons: ^1.0.8
  material_symbols_icons: ^4.2798.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.26.2

flutter:
  uses-material-design: true

resolution: workspace
